# Sample guided calibration wizard for Klipper (PT-BR)
#
# Objetivo:
#   Fornecer um fluxo passo-a-passo com "um botão" para calibração,
#   aplicando parâmetros gradualmente e coletando feedback do usuário.
#
# Requisitos recomendados:
#   [respond]
#   [save_variables] (opcional, para persistir melhores valores)
#
# Nota:
#   Comandos RESPOND TYPE=command MSG="action:prompt_*" funcionam em hosts
#   que suportam prompts (ex.: Mainsail/Fluidd com suporte habilitado).
#   Mesmo sem prompt gráfico, o fluxo segue via mensagens M117/RESPOND.

[gcode_macro CAL_WIZARD_STATE]
variable_step: 0
variable_profile: "PA"
variable_pa_start: 0.02
variable_pa_step: 0.005
variable_pa_value: 0.02
variable_accel: 5000
variable_scv: 5.0
variable_freq_x: 45.0
variable_freq_y: 45.0
variable_note: ""
gcode:
  # estado - não chamar diretamente

[gcode_macro CAL_WIZARD_START]
description: Inicia assistente guiado de calibração
# Uso: CAL_WIZARD_START PROFILE=PA|SHAPER|SPEED
gcode:
  {% set profile = params.PROFILE|default("PA")|upper %}
  SET_GCODE_VARIABLE MACRO=CAL_WIZARD_STATE VARIABLE=profile VALUE='"{profile}"'
  SET_GCODE_VARIABLE MACRO=CAL_WIZARD_STATE VARIABLE=step VALUE=1
  M117 Assistente: passo 1/4
  RESPOND TYPE=echo MSG="[CAL] Assistente iniciado ({profile})."
  RESPOND TYPE=echo MSG="[CAL] Passo 1: execute CAL_WIZARD_PRINT_TEST PROFILE={profile}."
  RESPOND TYPE=command MSG="action:prompt_begin Calibracao {profile}"
  RESPOND TYPE=command MSG="action:prompt_text Passo 1/4: imprimir teste de referencia"
  RESPOND TYPE=command MSG="action:prompt_footer_button Fechar|action:prompt_end|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro CAL_WIZARD_PRINT_TEST]
description: Imprime arquivo de teste do perfil
# Uso: CAL_WIZARD_PRINT_TEST PROFILE=PA|SHAPER|SPEED
# Ajuste os nomes dos arquivos para os seus testes reais no virtual SD.
gcode:
  {% set profile = params.PROFILE|default(printer["gcode_macro CAL_WIZARD_STATE"].profile)|upper %}
  {% if profile == "PA" %}
    RESPOND TYPE=echo MSG="[CAL] Imprimindo teste PA: /calibration/pressure_advance_tower.gcode"
    SDCARD_PRINT_FILE FILENAME=/calibration/pressure_advance_tower.gcode
  {% elif profile == "SHAPER" %}
    RESPOND TYPE=echo MSG="[CAL] Imprimindo teste SHAPER: /calibration/ringing_tower.gcode"
    SDCARD_PRINT_FILE FILENAME=/calibration/ringing_tower.gcode
  {% else %}
    RESPOND TYPE=echo MSG="[CAL] Imprimindo teste SPEED: /calibration/speed_stress.gcode"
    SDCARD_PRINT_FILE FILENAME=/calibration/speed_stress.gcode
  {% endif %}

[gcode_macro CAL_WIZARD_SET]
description: Registra ajuste informado pelo usuário
# Uso:
#   CAL_WIZARD_SET PA=0.035
#   CAL_WIZARD_SET ACCEL=7000 SCV=6.5
#   CAL_WIZARD_SET FREQ_X=48.2 FREQ_Y=39.5
gcode:
  {% if params.PA is defined %}
    SET_GCODE_VARIABLE MACRO=CAL_WIZARD_STATE VARIABLE=pa_value VALUE={params.PA|float}
  {% endif %}
  {% if params.ACCEL is defined %}
    SET_GCODE_VARIABLE MACRO=CAL_WIZARD_STATE VARIABLE=accel VALUE={params.ACCEL|float}
  {% endif %}
  {% if params.SCV is defined %}
    SET_GCODE_VARIABLE MACRO=CAL_WIZARD_STATE VARIABLE=scv VALUE={params.SCV|float}
  {% endif %}
  {% if params.FREQ_X is defined %}
    SET_GCODE_VARIABLE MACRO=CAL_WIZARD_STATE VARIABLE=freq_x VALUE={params.FREQ_X|float}
  {% endif %}
  {% if params.FREQ_Y is defined %}
    SET_GCODE_VARIABLE MACRO=CAL_WIZARD_STATE VARIABLE=freq_y VALUE={params.FREQ_Y|float}
  {% endif %}
  RESPOND TYPE=echo MSG="[CAL] Valores atualizados."

[gcode_macro CAL_WIZARD_APPLY]
description: Aplica os valores atuais no firmware
# Uso:
#   CAL_WIZARD_APPLY PROFILE=PA|SHAPER|SPEED
#   CAL_WIZARD_APPLY SAVE=1  (se [save_variables] estiver habilitado)
gcode:
  {% set st = printer["gcode_macro CAL_WIZARD_STATE"] %}
  {% set profile = params.PROFILE|default(st.profile)|upper %}

  {% if profile == "PA" %}
    SET_PRESSURE_ADVANCE ADVANCE={st.pa_value}
    RESPOND TYPE=echo MSG="[CAL] PA aplicado: {st.pa_value}"
    {% if params.SAVE|default(0)|int == 1 %}
      SAVE_VARIABLE VARIABLE=best_pa VALUE={st.pa_value}
    {% endif %}
  {% elif profile == "SHAPER" %}
    SET_INPUT_SHAPER SHAPER_FREQ_X={st.freq_x} SHAPER_FREQ_Y={st.freq_y}
    RESPOND TYPE=echo MSG="[CAL] SHAPER aplicado: X={st.freq_x} Y={st.freq_y}"
    {% if params.SAVE|default(0)|int == 1 %}
      SAVE_VARIABLE VARIABLE=best_shaper_freq_x VALUE={st.freq_x}
      SAVE_VARIABLE VARIABLE=best_shaper_freq_y VALUE={st.freq_y}
    {% endif %}
  {% else %}
    SET_VELOCITY_LIMIT ACCEL={st.accel} SQUARE_CORNER_VELOCITY={st.scv}
    RESPOND TYPE=echo MSG="[CAL] SPEED aplicado: ACCEL={st.accel} SCV={st.scv}"
    {% if params.SAVE|default(0)|int == 1 %}
      SAVE_VARIABLE VARIABLE=best_accel VALUE={st.accel}
      SAVE_VARIABLE VARIABLE=best_scv VALUE={st.scv}
    {% endif %}
  {% endif %}

[gcode_macro CAL_WIZARD_NEXT]
description: Avança passos do assistente com instruções de avaliação
# Fluxo sugerido:
#  1) CAL_WIZARD_START PROFILE=PA
#  2) CAL_WIZARD_PRINT_TEST
#  3) CAL_WIZARD_SET ...
#  4) CAL_WIZARD_APPLY
#  5) CAL_WIZARD_NEXT (repete ate o passo 4)
gcode:
  {% set st = printer["gcode_macro CAL_WIZARD_STATE"] %}
  {% set step = st.step|int + 1 %}
  SET_GCODE_VARIABLE MACRO=CAL_WIZARD_STATE VARIABLE=step VALUE={step}

  {% if step == 2 %}
    M117 Assistente: passo 2/4
    RESPOND TYPE=echo MSG="[CAL] Passo 2: avalie a peça teste e informe valores com CAL_WIZARD_SET."
    RESPOND TYPE=echo MSG="[CAL] PA: observe blobs/cantos. SHAPER: observe ringing. SPEED: observe perda de passos/qualidade."
  {% elif step == 3 %}
    M117 Assistente: passo 3/4
    RESPOND TYPE=echo MSG="[CAL] Passo 3: aplique valores com CAL_WIZARD_APPLY e rode novo teste."
  {% elif step >= 4 %}
    M117 Assistente: passo 4/4
    RESPOND TYPE=echo MSG="[CAL] Passo 4: finalize com CAL_WIZARD_APPLY SAVE=1 e salve no seu perfil."
    RESPOND TYPE=command MSG="action:prompt_begin Calibracao concluida"
    RESPOND TYPE=command MSG="action:prompt_text Revise o melhor valor e finalize com SAVE_CONFIG se aplicavel"
    RESPOND TYPE=command MSG="action:prompt_footer_button Ok|action:prompt_end|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro CAL_WIZARD_STATUS]
description: Mostra estado atual do assistente
gcode:
  {% set st = printer["gcode_macro CAL_WIZARD_STATE"] %}
  RESPOND TYPE=echo MSG="[CAL] Perfil={st.profile} Passo={st.step}"
  RESPOND TYPE=echo MSG="[CAL] PA={st.pa_value} ACCEL={st.accel} SCV={st.scv} FREQ_X={st.freq_x} FREQ_Y={st.freq_y}"
