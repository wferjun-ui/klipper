# Advanced guided + automatic calibration workflow for Klipper (PT-BR)
#
# Objetivo:
#   1) Executar calibração inicial na ordem correta automaticamente.
#   2) Rodar teste rápido conforme velocidade desejada pelo usuário.
#   3) Calcular parâmetros seguros (respeitando limites atuais do cfg).
#   4) Coletar feedback pós-teste com instruções de ajuste.
#
# Requisitos:
#   [respond]
#   [virtual_sdcard] (opcional, caso prefira testes por arquivo)
#   [save_variables] (opcional, para persistência)

[gcode_macro CAL_AUTO_STATE]
variable_target_speed: 120.0
variable_effective_speed: 120.0
variable_calc_accel: 3000.0
variable_calc_atd: 1500.0
variable_calc_scv: 5.0
variable_profile: "BALANCED"
variable_step: 0
gcode:
  # estado interno

[gcode_macro CAL_BTN_BASELINE]
description: [BOTAO] Calibracao inicial automatica na ordem correta
gcode:
  CAL_AUTO_BASELINE

[gcode_macro CAL_BTN_SPEED_TEST]
description: [BOTAO] Teste automatico por velocidade desejada
# Uso: CAL_BTN_SPEED_TEST TARGET_SPEED=150
gcode:
  {% set v = params.TARGET_SPEED|default(120)|float %}
  CAL_AUTO_SPEED_TEST TARGET_SPEED={v}

[gcode_macro CAL_BTN_ALL_IN_ONE]
description: [BOTAO] Executa baseline + teste de velocidade + checklist final
# Uso: CAL_BTN_ALL_IN_ONE TARGET_SPEED=150
gcode:
  {% set v = params.TARGET_SPEED|default(120)|float %}
  CAL_AUTO_BASELINE
  CAL_AUTO_SPEED_TEST TARGET_SPEED={v}

[gcode_macro CAL_AUTO_BASELINE]
description: Calibracao inicial automatica (ordem segura)
gcode:
  M117 Calibracao automatica: inicio
  RESPOND TYPE=echo MSG="[CAL][SAFE] Iniciando calibração automática na ordem recomendada."
  RESPOND TYPE=echo MSG="[CAL][SAFE] AVISO: valide fixacoes, bico limpo e superfície pronta antes de iniciar."

  # 1) Homing obrigatório
  G28

  # 2) Nivelamento por arquitetura (somente se modulo existir)
  {% if printer.quad_gantry_level is defined %}
    RESPOND TYPE=echo MSG="[CAL] Executando QUAD_GANTRY_LEVEL"
    QUAD_GANTRY_LEVEL
    G28 Z
  {% elif printer.z_tilt is defined %}
    RESPOND TYPE=echo MSG="[CAL] Executando Z_TILT_ADJUST"
    Z_TILT_ADJUST
    G28 Z
  {% elif printer.screws_tilt_adjust is defined %}
    RESPOND TYPE=echo MSG="[CAL] Executando SCREWS_TILT_CALCULATE (acao manual pode ser requerida)"
    SCREWS_TILT_CALCULATE
  {% endif %}

  # 3) Malha de cama (se existir)
  {% if printer.bed_mesh is defined %}
    RESPOND TYPE=echo MSG="[CAL] Executando BED_MESH_CALIBRATE"
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
  {% endif %}

  # 4) Ajuste de offset da sonda (se existir)
  {% if printer.probe is defined or printer.bltouch is defined %}
    RESPOND TYPE=echo MSG="[CAL] Dica: rode PROBE_CALIBRATE para refinamento fino de Z offset."
  {% endif %}

  SET_GCODE_VARIABLE MACRO=CAL_AUTO_STATE VARIABLE=step VALUE=1
  M117 Calibracao automatica: concluida
  RESPOND TYPE=echo MSG="[CAL] Baseline concluída. Use CAL_AUTO_SPEED_TEST TARGET_SPEED=<mm/s>."

[gcode_macro CAL_AUTO_SPEED_TEST]
description: Calcula parametros automaticamente e imprime teste rapido
# Uso: CAL_AUTO_SPEED_TEST TARGET_SPEED=150
gcode:
  {% set th = printer.toolhead %}
  {% set requested = params.TARGET_SPEED|default(120)|float %}
  {% set max_v = th.max_velocity|float %}
  {% set max_a = th.max_accel|float %}
  {% set eff_v = [requested, max_v]|min %}

  # Modelo simples: aceleração necessária para atingir velocidade em ~3mm
  {% set accel_need = (eff_v * eff_v) / 6.0 %}
  {% set calc_accel = [accel_need, max_a]|min %}
  {% set calc_atd = [calc_accel * 0.5, calc_accel]|min %}
  {% set base_scv = (eff_v * 0.05) %}
  {% set calc_scv = [[base_scv, 2.0]|max, 12.0]|min %}

  SET_GCODE_VARIABLE MACRO=CAL_AUTO_STATE VARIABLE=target_speed VALUE={requested}
  SET_GCODE_VARIABLE MACRO=CAL_AUTO_STATE VARIABLE=effective_speed VALUE={eff_v}
  SET_GCODE_VARIABLE MACRO=CAL_AUTO_STATE VARIABLE=calc_accel VALUE={calc_accel}
  SET_GCODE_VARIABLE MACRO=CAL_AUTO_STATE VARIABLE=calc_atd VALUE={calc_atd}
  SET_GCODE_VARIABLE MACRO=CAL_AUTO_STATE VARIABLE=calc_scv VALUE={calc_scv}
  SET_GCODE_VARIABLE MACRO=CAL_AUTO_STATE VARIABLE=step VALUE=2

  RESPOND TYPE=echo MSG="[CAL][SAFE] Velocidade solicitada: {requested:.1f} mm/s"
  RESPOND TYPE=echo MSG="[CAL][SAFE] Velocidade efetiva usada (clamp pelo cfg): {eff_v:.1f} mm/s"
  RESPOND TYPE=echo MSG="[CAL][SAFE] Limites atuais: max_velocity={max_v:.1f}, max_accel={max_a:.1f}"
  RESPOND TYPE=echo MSG="[CAL] Parametros calculados: ACCEL={calc_accel:.0f}, ACCEL_TO_DECEL={calc_atd:.0f}, SCV={calc_scv:.2f}"
  RESPOND TYPE=echo MSG="[CAL][WARN] Modelo teorico inicial: sempre valide por peça e reduza se houver sinais de instabilidade."

  SET_VELOCITY_LIMIT VELOCITY={eff_v} ACCEL={calc_accel} ACCEL_TO_DECEL={calc_atd} SQUARE_CORNER_VELOCITY={calc_scv}

  # Teste rápido integrado (sem depender de arquivo externo)
  CAL_PRINT_QUICK_DIAGNOSTIC SPEED={eff_v}

  RESPOND TYPE=echo MSG="[CAL] Teste finalizado. Execute CAL_POST_TEST_REVIEW para checklist guiado."

[gcode_macro CAL_PRINT_QUICK_DIAGNOSTIC]
description: Imprime padrao curto para avaliar cantos, fluxo e ringing
# Uso: CAL_PRINT_QUICK_DIAGNOSTIC SPEED=120
gcode:
  {% set speed = params.SPEED|default(120)|float %}
  {% set feed = speed * 60 %}

  RESPOND TYPE=echo MSG="[CAL] Iniciando padrão rápido de diagnóstico."
  RESPOND TYPE=echo MSG="[CAL][SAFE] Garanta bico e mesa aquecidos antes de chamar este macro."

  G90
  M83
  G92 E0
  G1 Z0.28 F1200
  G1 X20 Y20 F6000

  # Perímetro externo quadrado (avalia cantos/SCV)
  G1 X120 Y20  F{feed} E3.0
  G1 X120 Y120 F{feed} E3.0
  G1 X20  Y120 F{feed} E3.0
  G1 X20  Y20  F{feed} E3.0

  # Diagonais (avalia ringing e resposta dinâmica)
  G1 X120 Y120 F{feed} E4.0
  G1 X20  Y120 F{feed} E2.5
  G1 X120 Y20  F{feed} E2.5

  # Linhas paralelas (avalia constância de fluxo)
  {% for i in range(6) %}
    {% set y = 30 + (i * 12) %}
    G1 X20  Y{y} F{feed} E1.8
    G1 X120 Y{y} F{feed} E1.8
  {% endfor %}

  G1 Z2.0 F1200
  G92 E0
  RESPOND TYPE=echo MSG="[CAL] Padrão rápido concluído."

[gcode_macro CAL_POST_TEST_REVIEW]
description: Checklist guiado pós-teste + recomendações objetivas
gcode:
  {% set st = printer["gcode_macro CAL_AUTO_STATE"] %}
  RESPOND TYPE=echo MSG="[CAL][REVIEW] Velocidade efetiva testada: {st.effective_speed:.1f} mm/s"
  RESPOND TYPE=echo MSG="[CAL][REVIEW] Avalie:"
  RESPOND TYPE=echo MSG="[CAL][REVIEW] 1) Cantos salientes (blob): reduza PA em 0.002~0.005"
  RESPOND TYPE=echo MSG="[CAL][REVIEW] 2) Cantos vazios/subextrusao em mudança brusca: aumente PA em 0.002~0.005"
  RESPOND TYPE=echo MSG="[CAL][REVIEW] 3) Ringing/eco: reduza ACCEL 10-20% ou ajuste input_shaper"
  RESPOND TYPE=echo MSG="[CAL][REVIEW] 4) Linhas faltando: reduza velocidade 5-15% e revise temperatura"
  RESPOND TYPE=echo MSG="[CAL][REVIEW] 5) Canto muito arredondado: reduza SCV 0.5-1.0"
  RESPOND TYPE=echo MSG="[CAL][REVIEW] 6) Canto muito agressivo/impacto: reduza ACCEL_TO_DECEL 10-15%"
  RESPOND TYPE=command MSG="action:prompt_begin Revisao pos-teste"
  RESPOND TYPE=command MSG="action:prompt_text Se blob em cantos: SET_PRESSURE_ADVANCE ADVANCE=<atual-0.003>"
  RESPOND TYPE=command MSG="action:prompt_text Se canto vazio: SET_PRESSURE_ADVANCE ADVANCE=<atual+0.003>"
  RESPOND TYPE=command MSG="action:prompt_text Se ringing: SET_VELOCITY_LIMIT ACCEL=<atual*0.85>"
  RESPOND TYPE=command MSG="action:prompt_text Depois rode CAL_AUTO_SPEED_TEST novamente"
  RESPOND TYPE=command MSG="action:prompt_footer_button Ok|action:prompt_end|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro CAL_APPLY_USER_FEEDBACK]
description: Aplica ajuste rápido informado pelo usuário
# Uso:
#   CAL_APPLY_USER_FEEDBACK PA_DELTA=0.003
#   CAL_APPLY_USER_FEEDBACK ACCEL_FACTOR=0.85
#   CAL_APPLY_USER_FEEDBACK SCV_DELTA=-0.8
#   CAL_APPLY_USER_FEEDBACK SPEED_FACTOR=0.9
gcode:
  {% set st = printer["gcode_macro CAL_AUTO_STATE"] %}
  {% set v = st.effective_speed|float %}
  {% set a = st.calc_accel|float %}
  {% set atd = st.calc_atd|float %}
  {% set scv = st.calc_scv|float %}

  {% if params.SPEED_FACTOR is defined %}
    {% set v = v * (params.SPEED_FACTOR|float) %}
  {% endif %}
  {% if params.ACCEL_FACTOR is defined %}
    {% set a = a * (params.ACCEL_FACTOR|float) %}
    {% set atd = atd * (params.ACCEL_FACTOR|float) %}
  {% endif %}
  {% if params.SCV_DELTA is defined %}
    {% set scv = scv + (params.SCV_DELTA|float) %}
  {% endif %}

  # respeita limites do cfg
  {% set max_v = printer.toolhead.max_velocity|float %}
  {% set max_a = printer.toolhead.max_accel|float %}
  {% set v = [v, max_v]|min %}
  {% set a = [a, max_a]|min %}
  {% set atd = [atd, a]|min %}
  {% set scv = [[scv, 0.5]|max, 12.0]|min %}

  SET_VELOCITY_LIMIT VELOCITY={v} ACCEL={a} ACCEL_TO_DECEL={atd} SQUARE_CORNER_VELOCITY={scv}
  SET_GCODE_VARIABLE MACRO=CAL_AUTO_STATE VARIABLE=effective_speed VALUE={v}
  SET_GCODE_VARIABLE MACRO=CAL_AUTO_STATE VARIABLE=calc_accel VALUE={a}
  SET_GCODE_VARIABLE MACRO=CAL_AUTO_STATE VARIABLE=calc_atd VALUE={atd}
  SET_GCODE_VARIABLE MACRO=CAL_AUTO_STATE VARIABLE=calc_scv VALUE={scv}

  {% if params.PA_DELTA is defined %}
    RESPOND TYPE=echo MSG="[CAL] Ajuste de PA requerido. Execute SET_PRESSURE_ADVANCE ADVANCE=<atual + PA_DELTA>."
  {% endif %}

  RESPOND TYPE=echo MSG="[CAL] Feedback aplicado. Rode CAL_AUTO_SPEED_TEST TARGET_SPEED={v:.1f} para novo ciclo."
